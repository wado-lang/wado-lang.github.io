name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Kick a deploy from an API call:
  #   POST /repos/wado-lang/wado-lang.github.io/dispatches  {"event_type":"deploy"}
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # mise hits the GitHub Releases API to install the `wado` CLI.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise and install tools
        uses: jdx/mise-action@v4.2.3

      - name: Generate the blog
        run: |
          mise trust
          mise run blog-build

      - name: Build the playground
        uses: ./.github/actions/build-playground

      - name: Assemble the published site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/blog
          cp index.html CNAME dist/
          cp -r assets dist/
          cp -r _site/. dist/blog/
          # Sheaf emits the docs subtree under _site/docs; lift it to /docs.
          mv dist/blog/docs dist/docs
          mkdir -p dist/playground
          cp playground/index.html playground/app.js playground/app.css \
             playground/editor.worker.js dist/playground/
          # Monaco's codicon font is hash-named; copy via find so a zero match
          # doesn't abort the whole-site deploy under `set -e`.
          find playground -maxdepth 1 -name '*.ttf' -exec cp {} dist/playground/ \;
          cp -r playground/runtime dist/playground/runtime
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
