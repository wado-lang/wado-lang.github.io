name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # mise hits the GitHub Releases API to install the `wado` CLI.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise and install tools
        uses: jdx/mise-action@v2

      - name: Generate the blog
        run: |
          mise trust
          mise run blog-build

      - name: Assemble the published site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/blog
          cp index.html CNAME dist/
          cp -r assets dist/
          cp -r _site/. dist/blog/
          # Sheaf emits the docs subtree under _site/docs; lift it to /docs.
          mv dist/blog/docs dist/docs
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
