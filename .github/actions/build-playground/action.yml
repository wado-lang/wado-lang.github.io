name: Build playground
description: >
  Fetch the versioned playground runtime from the wado release
  (WADO_PLAYGROUND_VERSION, pinned in mise.toml) and bundle the page JS with
  esbuild. The caller must set up mise (jdx/mise-action) and export
  GITHUB_TOKEN first.

runs:
  using: composite
  steps:
    - name: Fetch the playground runtime and bundle the page
      shell: bash
      run: |
        set -euo pipefail
        mise trust
        mise run fetch-playground
        mise run playground-build
