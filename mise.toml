[tools]
# No language toolchain required for the static site itself.
# Tasks below shell out to git, which mise will resolve from PATH.

[tasks.fetch]
description = "Shallow-clone wado-lang/wado, refresh local assets, transparentize the logo"
run = """
set -euo pipefail
TMPDIR=".tmp/wado"
REPO="https://github.com/wado-lang/wado.git"

rm -rf "$TMPDIR"
mkdir -p "$(dirname "$TMPDIR")"
git clone --depth 1 "$REPO" "$TMPDIR"

mkdir -p assets
cp "$TMPDIR/wado-512.png"  assets/wado-512.png
cp "$TMPDIR/wado-1024.png" assets/wado-1024.png

# Upstream PNGs ship with a near-white background (~#fcfcfc) that shows
# as a faint square against the site's pure-white page. Strip it so the
# brushstroke sits on transparent.
python3 scripts/transparentize-logo.py assets/wado-512.png assets/wado-1024.png

echo
echo "Fetched and transparentized assets:"
ls -la assets/
"""

[tasks.clean]
description = "Remove the shallow clone under .tmp"
run = "rm -rf .tmp"

[tasks.serve]
description = "Serve the landing page on http://localhost:8000"
run = "python3 -m http.server 8000"
