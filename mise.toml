[tools]
"github:wado-lang/wado" = { version = "0.0.17", exe = "wado" }

[tasks.fetch-wado]
description = "Shallow-clone wado-lang/wado into .tmp/wado if absent (upstream docs source, logo)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ ! -d .tmp/wado ]; then
  git clone --depth 1 https://github.com/wado-lang/wado.git .tmp/wado
fi
"""

[tasks.fetch]
description = "Re-clone wado-lang/wado, refresh local assets, transparentize the logo"
run = """
#!/usr/bin/env bash
set -euo pipefail
TMPDIR=".tmp/wado"
REPO="https://github.com/wado-lang/wado.git"

rm -rf "$TMPDIR"
mkdir -p "$(dirname "$TMPDIR")"
git clone --depth 1 "$REPO" "$TMPDIR"

mkdir -p assets
cp "$TMPDIR/wado-512.png"  assets/wado-512.png
cp "$TMPDIR/wado-1024.png" assets/wado-1024.png

# Upstream PNGs ship with a near-white background (~#fcfcfc) that shows
# as a faint square against the site's pure-white page. Strip it so the
# brushstroke sits on transparent.
python3 scripts/transparentize-logo.py assets/wado-512.png assets/wado-1024.png

echo
echo "Fetched and transparentized assets:"
ls -la assets/
"""

[tasks.fetch-deps]
description = "Fetch registry component dependencies (wado-lang:marl) into the local cache before a parallel compile fetches them concurrently"
run = "wado fetch"

[tasks.blog-build]
depends = ["fetch-wado", "fetch-deps"]
description = "Generate the blog: content/*.md -> _site/ via Sheaf"
run = "wado run ."

[tasks.blog-test]
depends = ["fetch-wado", "fetch-deps"]
description = "Run Sheaf's Wado tests"
run = "wado test"

[tasks.playground-runtime]
description = "Stage the playground runtime (wasm, jco bundle, workers) from a built wado checkout (WADO_DIR, default .tmp/wado) into playground/runtime/"
run = """
#!/usr/bin/env bash
set -euo pipefail
WADO_DIR="${WADO_DIR:-.tmp/wado}"
WEB="$WADO_DIR/wado-playground/web"
if [ ! -f "$WEB/wado-playground.wasm" ] || [ ! -f "$WEB/wado-lsp.wasm" ]; then
  echo "error: $WEB is not built — run 'mise run playground-web-build' in $WADO_DIR" >&2
  exit 1
fi
rm -rf playground/runtime
mkdir -p playground/runtime
cp "$WEB"/playground.js "$WEB"/runner-worker.js "$WEB"/lsp-worker.js "$WEB"/lsp-client.js \
   "$WEB"/wado-playground.wasm "$WEB"/wado-lsp.wasm playground/runtime/
cp -r "$WEB"/vendor "$WEB"/shims playground/runtime/
ls -la playground/runtime/
"""

[tasks.playground-build]
description = "Bundle the playground page JS (Monaco + app) into playground/ with esbuild"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd playground
if [ -f package-lock.json ]; then npm ci; else npm install; fi
node build.mjs
"""

[tasks.playground-test]
description = "E2E smoke test for the built playground page (needs Chromium/Chrome 137+; CHROME_PATH overrides autodetection)"
run = "node playground/test-e2e.mjs"

[tasks.clean]
description = "Remove the shallow clone under .tmp, the generated _site, and playground build outputs"
run = "rm -rf .tmp _site playground/runtime playground/node_modules playground/app.js playground/app.css playground/editor.worker.js playground/*.ttf"

[tasks.serve]
description = "Serve the landing page on http://localhost:8000"
run = "python3 -m http.server 8000"
