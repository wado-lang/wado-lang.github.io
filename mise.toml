[tools]
"github:wado-lang/wado" = { version = "0.0.32", exe = "wado" }

[env]
# The wado release whose wado-playground-web.tar.gz asset the playground
# fetches. "latest" tracks the newest release; pin to a tag (e.g. v0.0.18) to
# freeze or roll back. The unpacked manifest.json records the concrete tag.
WADO_PLAYGROUND_VERSION = "latest"

[tasks.fetch-wado]
description = "Shallow-clone wado-lang/wado into .tmp/wado if absent (upstream docs source, logo)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ ! -d .tmp/wado ]; then
  git clone --depth 1 https://github.com/wado-lang/wado.git .tmp/wado
fi
"""

[tasks.fetch]
description = "Re-clone wado-lang/wado, refresh local assets, transparentize the logo"
run = """
#!/usr/bin/env bash
set -euo pipefail
TMPDIR=".tmp/wado"
REPO="https://github.com/wado-lang/wado.git"

rm -rf "$TMPDIR"
mkdir -p "$(dirname "$TMPDIR")"
git clone --depth 1 "$REPO" "$TMPDIR"

mkdir -p assets
cp "$TMPDIR/wado-512.png"  assets/wado-512.png
cp "$TMPDIR/wado-1024.png" assets/wado-1024.png

# Upstream PNGs ship with a near-white background (~#fcfcfc) that shows
# as a faint square against the site's pure-white page. Strip it so the
# brushstroke sits on transparent.
python3 scripts/transparentize-logo.py assets/wado-512.png assets/wado-1024.png

echo
echo "Fetched and transparentized assets:"
ls -la assets/
"""

[tasks.fetch-deps]
description = "Fetch registry component dependencies (wado-lang:marl, wado-lang:gale-highlight-wado) into the local cache before a parallel compile fetches them concurrently"
run = "wado fetch"

[tasks.blog-build]
depends = ["fetch-wado", "fetch-deps"]
description = "Generate the blog and docs: content/*.md -> _site/, upstream docs/*.md -> _site/docs/ via Sheaf"
run = "wado run ."

[tasks.blog-test]
depends = ["fetch-wado", "fetch-deps"]
description = "Run Sheaf's Wado tests"
run = "wado test"

[tasks.fetch-playground]
description = "Download and unpack the wado-playground-web release asset (WADO_PLAYGROUND_VERSION) into playground/runtime/"
run = """
#!/usr/bin/env bash
set -euo pipefail
VERSION="${WADO_PLAYGROUND_VERSION:-latest}"
if [ "$VERSION" = "latest" ]; then
  BASE="https://github.com/wado-lang/wado/releases/latest/download"
else
  BASE="https://github.com/wado-lang/wado/releases/download/$VERSION"
fi
TMP="$(mktemp -d)"
trap 'rm -rf "$TMP"' EXIT
curl -fsSL "$BASE/wado-playground-web.tar.gz" -o "$TMP/wado-playground-web.tar.gz"
curl -fsSL "$BASE/SHA256SUMS.txt" -o "$TMP/SHA256SUMS.txt"
( cd "$TMP" && grep ' wado-playground-web.tar.gz$' SHA256SUMS.txt | sha256sum -c - )
rm -rf playground/runtime
mkdir -p playground/runtime
tar xzf "$TMP/wado-playground-web.tar.gz" -C playground/runtime
echo "fetched wado-playground-web.tar.gz ($VERSION) into playground/runtime/"
"""

[tasks.playground-runtime]
description = "Stage the playground runtime from a locally built wado checkout (WADO_DIR, default .tmp/wado) — for developing against unreleased wado; deploy uses fetch-playground"
run = """
#!/usr/bin/env bash
set -euo pipefail
WADO_DIR="${WADO_DIR:-.tmp/wado}"
WEB="$WADO_DIR/wado-playground/web"
if [ ! -f "$WEB/wado-playground.wasm" ]; then
  echo "error: $WEB is not built — run 'mise run playground-web-build' in $WADO_DIR" >&2
  exit 1
fi
rm -rf playground/runtime
mkdir -p playground/runtime
# wado-playground.wasm bundles the LSP engine, so there is no separate LSP wasm.
cp "$WEB"/playground.js "$WEB"/runner-worker.js "$WEB"/lsp-worker.js "$WEB"/lsp-client.js \
   "$WEB"/wado-playground.wasm "$WEB"/examples.json playground/runtime/
cp -r "$WEB"/vendor "$WEB"/shims playground/runtime/
ls -la playground/runtime/
"""

[tasks.playground-build]
description = "Bundle the playground page JS (Monaco + app) into playground/ with esbuild"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd playground
if [ -f package-lock.json ]; then npm ci; else npm install; fi
node build.mjs
"""

[tasks.playground-test]
description = "E2E smoke test for the built playground page (needs Chromium/Chrome 137+; CHROME_PATH overrides autodetection)"
run = "node playground/test-e2e.mjs"

[tasks.fetch-wado-release]
description = "Check out Loam and its sibling packages from the wado release matching the installed CLI into .tmp/wado-release"
run = """
#!/usr/bin/env bash
set -euo pipefail
TAG="v$(wado --version | cut -d' ' -f2)"
DIR=.tmp/wado-release
if [ "$(git -C "$DIR" describe --tags --exact-match 2>/dev/null)" != "$TAG" ]; then
  rm -rf "$DIR"
  git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/wado-lang/wado.git "$DIR"
  git -C "$DIR" sparse-checkout set package-loam package-gale package-grog package-wadopoet
fi
"""

[tasks.gpt2-build]
depends = ["fetch-wado-release"]
description = "Build the GPT-2 page's component and stage upstream's checkpoint converter beside it"
run = """
#!/usr/bin/env bash
set -euo pipefail
EXAMPLE=.tmp/wado-release/package-loam/example/gpt2-124m
cp "$EXAMPLE/hf2loam.mjs" "$EXAMPLE/gpt2-header.safetensors" gpt2/
cd gpt2
# V8 does not implement the wide-arithmetic proposal yet.
wado build --lib -f no-wide-arithmetic -o gpt2web.wasm
"""

[tasks.clean]
description = "Remove the shallow clones under .tmp, the generated _site, and the playground and GPT-2 build outputs"
run = "rm -rf .tmp _site playground/runtime playground/node_modules playground/app.js playground/app.css playground/editor.worker.js playground/*.ttf gpt2/build gpt2/gpt2web.wasm gpt2/hf2loam.mjs gpt2/gpt2-header.safetensors"

[tasks.serve]
description = "Serve the landing page on http://localhost:8000"
run = "python3 -m http.server 8000"
