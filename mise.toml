[tools]
# No language toolchain required for the static site itself.
# Tasks below shell out to git, which mise will resolve from PATH.

[tasks.fetch]
description = "Shallow-clone wado-lang/wado and refresh local assets"
run = """
set -euo pipefail
TMPDIR=".tmp/wado"
REPO="https://github.com/wado-lang/wado.git"

rm -rf "$TMPDIR"
mkdir -p "$(dirname "$TMPDIR")"
git clone --depth 1 "$REPO" "$TMPDIR"

mkdir -p assets
cp "$TMPDIR/wado-512.png"  assets/wado-512.png
cp "$TMPDIR/wado-1024.png" assets/wado-1024.png

echo
echo "Fetched assets:"
ls -la assets/
"""

[tasks.clean]
description = "Remove the shallow clone under .tmp"
run = "rm -rf .tmp"

[tasks.serve]
description = "Serve the landing page on http://localhost:8000"
run = "python3 -m http.server 8000"
