[package]
name = "sheaf"
version = "0.1.0"
description = "Sheaf — the static blog generator (CMS) for wado-lang.github.io, written in Wado"
repository = "https://github.com/wado-lang/wado-lang.github.io"
license = "MIT"
authors = ["FUJI Goro <g.psy.va@gmail.com>"]

[world]
"wasi:cli/command" = "src/main.wado"

[test]
# The GPT-2 page's component is its own package, built by `mise run gpt2-build`.
exclude = ["gpt2/**"]

[registries]
default = "oci://ghcr.io"

[dependencies]
"wado-lang:marl" = { version = "^0.0.32" }
"wado-lang:gale-highlight-wado" = { version = "^0.0.32" }
